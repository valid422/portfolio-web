 name: CI - Linting Check

on:
  pull_request:
    branches: [ develop ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 16

      - name: Install linters
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard

      - name: Lint HTML files
        run: htmlhint "src/**/*.html" .htmlhintrc.json

      - name: Lint CSS files
        run: stylelint "styles/**/*.css" --config .stylelintrc.json
